<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: {{theme.card.background}}; font-family: {{theme.subtitle.fontFamily}}; color: {{theme.card.titleColor}};
         display: flex; align-items: center; justify-content: center; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 1.6vh; width: 100%; opacity: 0; }
  .brand { color: {{theme.card.brandColor}}; font-size: 1.7vh; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  .title { font-size: 5.2vh; font-weight: 800; letter-spacing: -.03em; text-align: center; max-width: 82%; line-height: 1.2; }
  .tagline { color: {{theme.card.taglineColor}}; font-size: 2.2vh; font-weight: 500; text-align: center; max-width: 74%; opacity: 0; }
  .cta { margin-top: 3vh; padding: 1.2vh 2.6vh; border: 2px solid {{theme.card.brandColor}}; border-radius: 999px;
         color: {{theme.card.brandColor}}; font-size: 2vh; font-weight: 600; opacity: 0; }
  body.play .card { animation: cardIn .5s ease-out forwards; }
  body.play .tagline { animation: subUp .5s ease-out .2s forwards; }
  body.play .cta { animation: subUp .5s ease-out .45s forwards; }
  @keyframes cardIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }
  @keyframes subUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">{{brand}}</div>
    <div class="title">{{title}}</div>
    <div class="tagline">{{tagline}}</div>
    <div class="cta">{{cta}}</div>
  </div>
</body>
</html>
