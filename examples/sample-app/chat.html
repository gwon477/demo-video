<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Camino - 분석 도우미</title><link rel="stylesheet" href="app.css"></head>
<body>
<header>
  <div class="logo">Camino</div>
  <nav>
    <a href="index.html">대시보드</a>
    <a href="board.html">우선순위 보드</a>
    <a href="upload.html">결과 업로드</a>
    <a href="chat.html">분석 도우미</a>
    <a href="settings.html">설정</a>
  </nav>
  <div class="kbd-hint">명령 팔레트 <kbd>⌘</kbd> <kbd>K</kbd></div>
</header>
<div id="palette"><div class="box"><input type="text" placeholder="명령 또는 화면 이름 입력..." aria-label="명령 팔레트"></div></div>
<main>

<h1>분석 도우미</h1>
<p class="sub">실패 원인을 물어보면 로그와 diff를 읽고 수정 방향을 제안합니다</p>
<div class="panel"><div class="chat" data-testid="chat-log"></div>
<p class="status" data-testid="chat-status" data-state="idle">대기 중</p>
<div style="display:flex;gap:8px;margin-top:12px"><input type="text" data-testid="chat-input" aria-label="질문" placeholder="실패한 테스트를 분석해줘"><button class="primary" data-testid="chat-send">보내기</button></div></div>

</main>
<script src="app.js"></script></body></html>
